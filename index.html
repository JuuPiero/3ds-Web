<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #n3ds {
            position: relative;
            display: inline-block;
        }

        #n3ds .bg {
            display: block;
            width: 100%;
            height: auto;
        }

        #n3ds canvas {
            position: absolute;
        }
    </style>
</head>

<body>
    <div id="n3ds">
        <img src="test.png" alt="3DS" class="bg">
        <canvas id="screen-top"></canvas>
        <canvas id="screen-bottom"></canvas>
    </div>
</body>
